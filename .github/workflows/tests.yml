name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0-beta.4'
      SERVERPOD_PASSWORD_database: '69i2p2r1JSht6jU2_UCxCkpGUkHx629B'
      SERVERPOD_PASSWORD_redis: '4TQzVfOpm4JjMmvxCgd2oQy22P49m3Zg'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Start containers
        working-directory: weakspot_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart install serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: weakspot_server
        run: serverpod generate

      - name: Run tests
        working-directory: weakspot_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: weakspot_server
        run: docker compose down -v
