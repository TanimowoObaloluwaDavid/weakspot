services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: weakspot
      POSTGRES_PASSWORD: "XYkGYHa9rSr_HeP3bwHyDhv-mTAEadEI"
    volumes:
      - weakspot_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "QlJ40_IzSuyNkd9hbxkwrstpAI4nsQbt"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: weakspot_test
      POSTGRES_PASSWORD: "69i2p2r1JSht6jU2_UCxCkpGUkHx629B"
    volumes:
      - weakspot_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "4TQzVfOpm4JjMmvxCgd2oQy22P49m3Zg"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  weakspot_data:
  weakspot_test_data:
